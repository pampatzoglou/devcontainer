version: "3"

vars:
  IMAGE: ghcr.io/pampatzoglou/devcontainer
  DIR: .
  DOCKERFILE: Dockerfile
  LOCK: pre-commit.lock
  PLATFORMS: linux/amd64,linux/arm64
  # Same image (tag + digest) as the CI audit job in .github/workflows/default.yaml.
  ACTIONLINT_IMAGE: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  validate:
    desc: Check pre-commit.lock matches PRECOMMIT_VERSION and every hash ARG is set
    cmds:
      - DOCKERFILE={{.DOCKERFILE}} LOCK={{.LOCK}} ./scripts/validate.sh

  lint:
    desc: Lint the Dockerfile, the shell scripts and the GitHub workflows/actions
    cmds:
      - hadolint {{.DOCKERFILE}}
      - docker run --rm -v "$PWD:/repo:ro" -w /repo {{.ACTIONLINT_IMAGE}} -color
      # shellcheck bundled in the actionlint image: one pinned image for both.
      - >-
        docker run --rm -v "$PWD:/repo:ro" -w /repo --entrypoint shellcheck
        {{.ACTIONLINT_IMAGE}}
        image/init-firewall.sh image/claude-default-plugins.sh scripts/validate.sh

  audit:
    desc: Full pre-merge gate — validate, lint
    cmds:
      - task: validate
      - task: lint

  build:
    desc: Build and load the image for the local platform as :dev (PLATFORM=linux/amd64 to override)
    vars:
      PLATFORM: '{{.PLATFORM | default ""}}'
    cmds:
      - >-
        docker buildx build --load --tag {{.IMAGE}}:dev
        {{if .PLATFORM}}--platform {{.PLATFORM}}{{end}} {{.DIR}}

  pin:
    desc: Refresh every <TOOL>_SHA256_<ARCH> ARG from upstream's sums files (both arches)
    cmds:
      - rm -rf .pins
      - >-
        docker buildx build --platform {{.PLATFORMS}} --build-arg PIN_MODE=1
        --target pins --output type=local,dest=.pins {{.DIR}}
      - |
        set -eu
        tmp=$(mktemp)
        for f in .pins/*/*; do
          n=$(basename "$f"); v=$(cat "$f")
          awk -v n="$n" -v v="$v" 'index($0, "ARG " n "=") == 1 { $0 = "ARG " n "=" v } { print }' \
            {{.DOCKERFILE}} > "$tmp"
          cat "$tmp" > {{.DOCKERFILE}}
        done
        rm -f "$tmp"
        rm -rf .pins
        git --no-pager diff --stat -- {{.DOCKERFILE}}
      - task: validate

  lock:
    desc: Regenerate pre-commit.lock for PRECOMMIT_VERSION from a PyPI snapshot (default 3 days ago)
    vars:
      SNAPSHOT: '{{.SNAPSHOT | default (dateInZone "2006-01-02T00:00:00Z" (now | dateModify "-72h") "UTC")}}'
    cmds:
      - |
        set -eu
        ver=$(sed -n 's/^ARG PRECOMMIT_VERSION=//p' {{.DOCKERFILE}})
        py=$(sed -n 's/^ARG PYTHON_VERSION=\([0-9]*\.[0-9]*\).*/\1/p' {{.DOCKERFILE}})
        body=$(echo "pre-commit==$ver" | uv pip compile - --quiet --no-header --generate-hashes \
          --universal --python-version "$py" --exclude-newer "{{.SNAPSHOT}}")
        printf '%s\n%s\n%s\n' '# Generated by `task lock`; do not edit.' \
          '# PyPI snapshot: {{.SNAPSHOT}}' "$body" > {{.LOCK}}
      - task: validate

  clean:
    desc: Remove generated artifacts
    cmds:
      - rm -rf .pins
