name: "Attest and sign"
description: >-
  Attach a signed SLSA build-provenance attestation to a pushed image digest and cosign-sign
  it (keyless). Used by build-push and merge-push. The calling job needs `packages: write`,
  `id-token: write` and `attestations: write`, and must already be logged in to the registry.
inputs:
  image-name:
    description: "Image repository without tag, e.g. ghcr.io/owner/project/service"
    required: true
  digest:
    description: "Digest to attest and sign (sha256:...): for a multi-arch image, the index"
    required: true

runs:
  using: "composite"
  steps:
    # Provenance is bound to the digest, so it covers every tag; pushed to the registry
    # alongside the image and recorded in the repo's attestations.
    # Verify: gh attestation verify oci://<image>@<digest> --owner <owner>
    - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-name: ${{ inputs.image-name }}
        subject-digest: ${{ inputs.digest }}
        push-to-registry: true

    # Keyless cosign signature (Fulcio cert from the job's OIDC token, logged in Rekor) on
    # the digest, never a tag: a tag can be moved, the digest can't. Signing an index also
    # covers the per-platform manifests and attestations (SBOMs) it references.
    # Verify: cosign verify <image>@<digest> \
    #   --certificate-identity-regexp '^https://github.com/<owner>/<repo>/' \
    #   --certificate-oidc-issuer https://token.actions.githubusercontent.com
    - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
    - shell: bash
      env:
        IMAGE: ${{ inputs.image-name }}@${{ inputs.digest }}
      run: cosign sign --yes "$IMAGE"
