name: "Build and push"
description: >-
  Build an image with buildx (gha cache); when push is true, push it to the registry,
  attach a signed SLSA build-provenance attestation and cosign-sign the digest (keyless).
  With push-by-digest, push one platform untagged and unsigned for merge-push to combine.
  The calling job needs
  `packages: write`, `id-token: write` and `attestations: write` to push.
inputs:
  image-name:
    description: "Image repository without tag, e.g. ghcr.io/owner/project/service"
    required: true
  context:
    description: "Build context"
    default: "."
  file:
    description: "Dockerfile path, relative to the workspace (not to context)"
    default: "Dockerfile"
  target:
    description: "Dockerfile target stage"
    default: ""
  platforms:
    description: "Comma-separated target platforms; QEMU unless just the runner's own"
    default: "linux/amd64"
  tags:
    description: "docker/metadata-action tag rules"
    default: |
      type=raw,value=main,enable={{is_default_branch}}
      type=sha,format=long
  cache-scope:
    description: "GHA cache scope; defaults to image-name. Set per matrix leg to avoid clobbering"
    default: ""
  push:
    description: "Push and attest the image ('true'/'false'); false only builds"
    default: "false"
  push-by-digest:
    description: >-
      With push, push untagged by digest only and skip attest/sign ('true'/'false'): one leg of
      a native per-arch matrix; merge-push then tags, attests and signs the combined index.
    default: "false"
  sbom:
    description: >-
      Attach a BuildKit SPDX SBOM attestation per platform ('true'/'false'). Only when push
      is true: it lives in the pushed image index, so the cosign signature on the index digest
      covers it. Verify: docker buildx imagetools inspect <image> --format '{{ json .SBOM }}'
    default: "false"
  load:
    description: "Load the result into the runner's docker (single platform only), e.g. to scan it"
    default: "false"
  registry:
    description: "Registry to log in to when pushing"
    default: "ghcr.io"
  registry-username:
    description: "Registry username"
    default: ""
  registry-password:
    description: "Registry password or token"
    default: ""

outputs:
  image:
    description: "Pushed image pinned by digest (<image-name>@<digest>); empty when not pushed"
    value: ${{ inputs.push == 'true' && format('{0}@{1}', inputs.image-name, steps.build.outputs.digest) || '' }}
  digest:
    description: "Image manifest digest (sha256:...)"
    value: ${{ steps.build.outputs.digest }}
  imageid:
    description: "Image ID (config digest)"
    value: ${{ steps.build.outputs.imageid }}
  tags:
    description: "Newline-separated tags applied to the image"
    value: ${{ steps.meta.outputs.tags }}
  metadata:
    description: "Build result metadata JSON"
    value: ${{ steps.build.outputs.metadata }}

runs:
  using: "composite"
  steps:
    # Skipped for a single native platform (linux/amd64 on X64, linux/arm64 on ARM64).
    - if: inputs.platforms != format('linux/{0}', runner.arch == 'ARM64' && 'arm64' || 'amd64')
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - if: inputs.push == 'true'
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.registry-username }}
        password: ${{ inputs.registry-password }}

    # Default scheme: :main on the default branch, :sha-<full commit> always.
    - id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ${{ inputs.image-name }}
        tags: ${{ inputs.tags }}
        labels: |
          maintainer=${{ github.repository_owner }}
          org.opencontainers.image.title=${{ github.repository }}
          org.opencontainers.image.description=${{ inputs.image-name }}
          org.opencontainers.image.vendor=${{ github.repository_owner }}

    - id: build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.file }}
        target: ${{ inputs.target }}
        platforms: ${{ inputs.platforms }}
        push: ${{ inputs.push == 'true' && inputs.push-by-digest != 'true' }}
        outputs: >-
          ${{ inputs.push == 'true' && inputs.push-by-digest == 'true'
          && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true',
          inputs.image-name) || '' }}
        load: ${{ inputs.load == 'true' }}
        sbom: ${{ inputs.push == 'true' && inputs.sbom == 'true' }}
        tags: ${{ inputs.push-by-digest != 'true' && steps.meta.outputs.tags || '' }}
        labels: ${{ steps.meta.outputs.labels }}
        annotations: ${{ steps.meta.outputs.annotations }}
        # Scoped per image (or cache-scope) so matrix jobs don't overwrite each other's cache.
        cache-from: type=gha,scope=${{ inputs.cache-scope || inputs.image-name }}
        cache-to: type=gha,mode=max,scope=${{ inputs.cache-scope || inputs.image-name }}

    - if: inputs.push == 'true' && inputs.push-by-digest != 'true'
      uses: ./.github/actions/attest-sign
      with:
        image-name: ${{ inputs.image-name }}
        digest: ${{ steps.build.outputs.digest }}
